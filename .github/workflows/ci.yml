name: RustCleaner Windows CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (Windows x64 Static CRT)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: cargo test --verbose

      - name: Build Portable Release EXE (+crt-static)
        run: cargo build --release --verbose

      - name: Rename Portable Binary for Release
        run: Copy-Item "target/release/rustcleaner.exe" "RustCleaner-Windows-x64-Portable.exe"

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustCleaner-Windows-x64-Portable
          path: RustCleaner-Windows-x64-Portable.exe

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RustCleaner-Windows-x64-Portable.exe
          generate_release_notes: true
